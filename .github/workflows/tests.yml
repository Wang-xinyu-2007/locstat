name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 跑单元测试
        run: python -m unittest discover -s tests -v

      - name: 在自己身上跑一遍
        run: python locstat.py examples/demo
